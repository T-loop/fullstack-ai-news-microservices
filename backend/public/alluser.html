<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktuelle Nachrichten</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    /* Header */
    h1 {
      color: #d32f2f; /* Spiegel-Rot */
      font-weight: bold;
      margin: 0;
    }

    /* Artikel Cards */
    .article {
      position: relative;
      color: white;
      border-radius: 10px;
      overflow: hidden;
      height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 15px;
      margin-bottom: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .article:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .article h3 {
      font-weight: bold;
      background-color: rgba(211, 47, 47, 0.85); /* roter Titelhintergrund */
      padding: 5px 10px;
      display: inline-block;
      border-radius: 5px;
      margin-bottom: 5px;
    }

    .article p {
      background-color: rgba(0, 0, 0, 0.55);
      padding: 5px 10px;
      border-radius: 5px;
      margin: 0 0 5px 0;
      font-size: 0.9rem;
    }

    .article small {
      background-color: rgba(0, 0, 0, 0.55);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #343a40;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<div class="container my-4">
  <!-- Kompakter Header -->
  <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-3">
    <h1>Aktuelle Nachrichten</h1>
    <a href="login.html" class="btn btn-sm btn-outline-dark mt-2 mt-md-0">Admin</a>
  </div>

  <!-- Kategorie-Buttons -->
  <div class="d-flex flex-wrap gap-2 justify-content-center mb-4">
    <button class="btn btn-outline-danger btn-sm" onclick="loadAll()">Alle</button>
    <button class="btn btn-outline-danger btn-sm" onclick="loadCategory('Politik')">Politik</button>
    <button class="btn btn-outline-danger btn-sm" onclick="loadCategory('Geschichte')">Geschichte</button>
    <button class="btn btn-outline-danger btn-sm" onclick="loadCategory('Wissenschaft')">Wissenschaft</button>
    <button class="btn btn-outline-danger btn-sm" onclick="loadCategory('Geografie')">Geografie</button>
    <button class="btn btn-outline-danger btn-sm" onclick="loadCategory('Unterhaltung')">Unterhaltung</button>
    <button class="btn btn-outline-danger btn-sm" onclick="loadCategory('Wirtschaft')">Wirtschaft</button>
    <button class="btn btn-outline-danger btn-sm" onclick="loadCategory('Technologie')">Technologie</button>
    <button class="btn btn-outline-danger btn-sm" onclick="loadCategory('Sport')">Sport</button>
  </div>

  <!-- News Container -->
  <div id="news" class="row"></div>
</div>

<footer>
  &copy; 2026 Nachrichtenportal | <a href="login.html" class="text-white">Admin</a>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
async function loadAll() {
  const res = await fetch("/public/getallnews");
  const news = await res.json();
  render(news);
}

async function loadCategory(cat) {
  const res = await fetch(`/public/getnewsbycategory/${cat}`);
  const news = await res.json();
  render(news);
}

function getImageByCategory(category) {
  switch(category) {
    case "Wissenschaft": return "url('wissenschaft.jpg')";
    case "Sport": return "url('sport.jpg')";
    case "Technologie": return "url('technologie.jpg')";
    case "Politik": return "url('politik.jpg')";
    case "Geschichte": return "url('geschichte.jpg')";
    case "Geografie": return "url('geografie.jpg')";
    case "Unterhaltung": return "url('unterhaltung.jpg')";
    case "Wirtschaft": return "url('wirtschaft.jpg')";
    default: return "url('default.jpg')";
  }
}

function render(news) {
  const container = document.getElementById("news");
  container.innerHTML = "";

  news.forEach(n => {
    const col = document.createElement("div");
    col.className = "col-md-6";

    const article = document.createElement("div");
    article.classList.add("article");
    article.style.backgroundImage = getImageByCategory(n.category);
    article.style.backgroundSize = "cover";
    article.style.backgroundPosition = "center";

    article.innerHTML = `
      <h3>${n.title}</h3>
      <p>${n.content}</p>
      <small>${n.category}</small>
    `;

    col.appendChild(article);
    container.appendChild(col);
  });
}

// Laden beim Start
loadAll();
</script>

</body>
</html>
